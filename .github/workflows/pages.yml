# Publishes live-preview/ (the built MindMirror web app) to GitHub Pages:
# https://pankqx.github.io/preparation/
name: Live preview on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['live-preview/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live-preview
      - id: deployment
        uses: actions/deploy-pages@v4
